<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="X folios">
  <title>X folios</title>
  <style>
    .ink { fill: currentColor; }
    .line { fill: none; stroke: currentColor; stroke-width: 4.3; }
  </style>

  <!-- tile (attributes are a fallback if CSS is stripped) -->
  <rect class="bg" width="512" height="512" rx="20" fill="#0a1013"/>

  <g class="fg" fill="none" stroke="#fafafa">
    <!-- frame -->
    <rect x="20" y="20" width="472" height="472" rx="14" stroke-width="14"/>
    <!-- hollow stroke of the X -->
    <polygon points="120,104 156,104 396,408 360,408" stroke-width="12" stroke-linejoin="miter"/>
    <!-- solid "f" stroke of the X, with crossbar -->
    <g stroke-width="26" stroke-linecap="butt" stroke-linejoin="round">
      <path d="M166 410C214 404 246 372 249 300L253 204C256 152 274 120 318 114C334 112 350 113 364 118"/>
      <path d="M246 264C290 264 328 259 372 252" stroke-width="22"/>
    </g>
  </g>
</svg>

